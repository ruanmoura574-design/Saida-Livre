<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Comanda Online</title>
<meta name="theme-color" content="#1c1613">
<meta name="description" content="Comanda digital para restaurantes: garçom, preparo e caixa conectados no celular.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* layout: uma tela por função; barra fixa no topo, lista rolando, ação principal fixa embaixo */
:root{
  --coal:#120e0c;--coal2:#1c1613;--coal3:#2a211c;--coal4:#352a23;--line:#3d3029;
  --ash:#f4ece5;--ash2:#b9aa9e;--ash3:#8a7b70;
  --ember:#ff6a13;--fire:#e8430a;--gold:#ffc24a;--ok:#3ddc84;--warn:#ffb020;--bad:#ff5a4f;--sky:#5cc8ff;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--coal);color:var(--ash)}
body{margin:0;padding-bottom:env(safe-area-inset-bottom,0px);font:500 16px/1.4 var(--body);-webkit-tap-highlight-color:transparent;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--coal2)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--coal2);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px;padding-block:6px}
.brand{font:400 22px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand span{color:var(--ember)}
.rolebtn{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--coal3);border-radius:99px;padding:6px 12px;font:700 15px var(--cond);letter-spacing:.06em;text-transform:uppercase;min-height:40px}
.sync{width:10px;height:10px;border-radius:50%;background:var(--ash3);flex:none}
.sync.on{background:var(--ok)}.sync.wait{background:var(--warn)}.sync.local{background:var(--sky)}
.note{font-size:13px;color:var(--ash2)}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:#5cc8ff14;border:1px solid #5cc8ff44;color:var(--ash);font-size:14px}
.banner.err{background:#ff5a4f14;border-color:#ff5a4f55}
main{padding-block:14px 120px}
h2.sec{font:400 26px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:18px 0 10px;display:flex;align-items:baseline;gap:10px}
h2.sec small{font:600 14px var(--cond);letter-spacing:.08em;color:var(--ash2)}
/* escolher função */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-top:8px}
.role{display:grid;gap:4px;text-align:left;border:1px solid var(--line);background:var(--coal2);border-radius:16px;padding:18px 16px;min-height:110px}
.role b{font:400 30px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.role span{color:var(--ash2);font-size:15px}
.role:active{background:var(--coal3)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:1px}
.d-churrasqueira{background:var(--ember)}.d-cozinha{background:var(--gold)}.d-bebidas{background:var(--sky)}.d-garcom{background:var(--ok)}.d-caixa{background:var(--ash)}
/* mesas */
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.mesa{position:relative;display:grid;align-content:start;gap:2px;border:1px solid var(--line);background:var(--coal2);border-radius:14px;padding:10px 10px 12px;min-height:96px;text-align:left}
.mesa .num{font:400 34px/1 var(--display)}
.mesa .st{font:700 14px var(--cond);letter-spacing:.04em;color:var(--ash3);text-transform:uppercase}
.mesa.occ{background:#ff6a1318;border-color:#ff6a1388}
.mesa.occ .st{color:var(--gold)}
.mesa .t{font-size:12px;color:var(--ash2)}
.mesa .flag{position:absolute;top:8px;right:8px;font:800 11px var(--cond);letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:2px 7px}
.flag.ready{background:var(--ok);color:#06260e}.flag.bill{background:var(--gold);color:#2a1600}
/* cartões de pedido pronto (garçom) */
.ready-list{display:grid;gap:8px}
.rd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:#3ddc8412;border:1px solid #3ddc8466;border-radius:14px;padding:10px 12px}
.rd b{font:400 22px/1 var(--display);text-transform:uppercase}
.rd p{margin:2px 0 0;font-size:15px}
/* botões */
.btn{border:0;border-radius:12px;padding:12px 16px;min-height:46px;font:800 16px var(--cond);letter-spacing:.06em;text-transform:uppercase;background:var(--coal4);color:var(--ash)}
.btn.pri{background:var(--ember);color:#1d0a00}
.btn.ok{background:var(--ok);color:#06260e}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5}
/* mesa aberta (garçom) */
.mhead{display:flex;align-items:center;gap:10px;margin-top:4px}
.back{white-space:nowrap;flex:none;border:1px solid var(--line);background:var(--coal2);border-radius:12px;min-height:44px;padding:0 12px;font:700 15px var(--cond);text-transform:uppercase;letter-spacing:.06em}
.mhead h1{font:400 30px/1 var(--display);text-transform:uppercase;margin:0;white-space:nowrap}
.mhead .tot{margin-left:auto;text-align:right;font:400 24px/1 var(--display);color:var(--gold)}
.mhead .tot small{display:block;font:600 12px var(--cond);color:var(--ash2);letter-spacing:.06em;text-transform:uppercase}
.box{background:var(--coal2);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:12px}
.tk{display:grid;gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.tk:first-child{border-top:0;padding-top:0}
.tk .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:700 14px var(--cond);letter-spacing:.05em;text-transform:uppercase;color:var(--ash2)}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font:800 12px var(--cond);letter-spacing:.06em;text-transform:uppercase}
.p-novo{background:var(--coal4);color:var(--ash)}.p-preparo{background:var(--warn);color:#2b1a00}.p-pronto{background:var(--ok);color:#06260e}.p-entregue{background:transparent;border:1px solid var(--line);color:var(--ash3)}
.tk .its{font-size:15px}
.chips{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:10;display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin-top:8px;background:var(--coal);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--coal2);border-radius:99px;padding:8px 14px;font:700 15px var(--cond);letter-spacing:.05em;text-transform:uppercase;min-height:40px}
.cat h3{font:400 22px/1 var(--display);text-transform:uppercase;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.cat h3 small{margin-left:auto;font:600 13px var(--cond);color:var(--ash2);letter-spacing:.06em}
.grp{font:800 13px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--ember);margin:10px 2px 4px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--coal2);border-radius:12px;padding:10px 12px;margin-bottom:6px;min-height:52px}
.item:active{background:var(--coal3)}
.item b{display:block;font:700 17px/1.15 var(--cond);letter-spacing:.02em;text-transform:uppercase}
.item small{display:block;color:var(--ash2);font-size:13px}
.item .ip{font:700 16px var(--cond);color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
.item .plus{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--ember);color:#1d0a00;font:800 22px/1 var(--body);position:relative}
.item .plus i{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;border-radius:99px;background:var(--gold);color:#2a1600;font:800 12px/22px var(--body);font-style:normal;text-align:center;padding:0 5px}
/* barra fixa embaixo */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,transparent,var(--coal) 35%)}
.dock .btn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;max-width:868px;margin:0 auto;min-height:56px;font-size:18px}
.dock .cnt{background:#0003;border-radius:99px;padding:2px 10px}
/* folha (sheet) */
.sheet{position:fixed;inset:0;z-index:40;background:#000b;display:grid;align-items:end;justify-items:center}
.sheet .in{width:100%;max-width:620px;max-height:92%;overflow:auto;background:var(--coal2);border-radius:22px 22px 0 0;border-top:3px solid var(--ember);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.sheet h3{font:400 28px/1.05 var(--display);text-transform:uppercase;margin:0 46px 12px 0}
.x{float:right;width:40px;height:40px;border-radius:12px;border:0;background:var(--coal4);font-size:22px}
.fld{display:grid;gap:6px;margin-top:12px}
.fld>span{font:700 14px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--ash2)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--coal);border-radius:12px;padding:10px 12px;min-height:46px;font:700 15px var(--cond);letter-spacing:.04em;text-transform:uppercase}
.seg button[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:#1d0a00}
.seg.col{flex-direction:column}.seg.col button{text-align:left}
input[type=text],input[type=number],input[inputmode]{width:100%;background:var(--coal);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ash);font:500 16px var(--body);min-height:46px}
.step{display:flex;align-items:center;gap:10px}
.qb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--coal3);font:800 20px var(--body)}
.step b{min-width:28px;text-align:center;font:400 24px var(--display)}
.dl{display:grid;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.dl .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.dl b{font:700 17px var(--cond);text-transform:uppercase;letter-spacing:.02em}
.dl small{display:block;color:var(--ash2);font-size:13px}
.route{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px;font:700 14px var(--cond);letter-spacing:.05em;text-transform:uppercase;color:var(--ash2)}
/* telas de preparo */
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px}
.tc{display:grid;gap:10px;background:var(--coal2);border:1px solid var(--line);border-radius:16px;padding:14px}
.tc.new{border-color:var(--ember);animation:pulse 1.2s ease 3}
@keyframes pulse{50%{background:#ff6a1333}}
.tc .h{display:flex;align-items:baseline;gap:10px}
.tc .m{font:400 40px/1 var(--display);text-transform:uppercase}
.tc .age{margin-left:auto;font:700 16px var(--cond);color:var(--ash2);text-align:right}
.tc .age.warn{color:var(--warn)}.tc .age.bad{color:var(--bad)}
.tc ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tc li{font:700 21px/1.15 var(--cond);letter-spacing:.01em}
.tc li small{display:block;font:500 15px var(--body);color:var(--ash2)}
.tc li .ob{display:block;width:fit-content;margin-top:3px;background:var(--gold);color:#2a1600;border-radius:8px;padding:1px 8px;font:700 15px var(--body)}
.tc .acts{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.empty{text-align:center;color:var(--ash2);padding:36px 12px;border:1px dashed var(--line);border-radius:16px}
.empty b{display:block;font:400 24px var(--display);text-transform:uppercase;color:var(--ash);margin-bottom:4px}
.done{display:grid;gap:6px}
.done .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;font-size:14px;color:var(--ash2)}
/* caixa */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--coal2);border-radius:12px;padding:8px 14px;min-height:42px;font:700 15px var(--cond);letter-spacing:.05em;text-transform:uppercase}
.tab[aria-pressed="true"]{background:var(--ash);color:var(--coal);border-color:var(--ash)}
.tab i{font-style:normal;background:var(--ember);color:#1d0a00;border-radius:99px;padding:0 7px;margin-left:6px;font-size:13px}
.acc{display:grid;gap:8px}
.ac{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--coal2);border-radius:14px;padding:10px 12px;min-height:64px}
.ac .num{font:400 32px/1 var(--display);min-width:44px}
.ac .v{font:400 22px var(--display);color:var(--gold)}
.lines{display:grid}
.ln{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.ln:first-child{border-top:0}
.ln .q{font:400 20px var(--display);min-width:30px}
.ln .v{font-variant-numeric:tabular-nums;white-space:nowrap}
.ln small{display:block;color:var(--ash2);font-size:13px}
.ln .qb{width:36px;height:36px;font-size:18px}
.sum{display:grid;gap:6px;margin-top:10px;padding-top:10px;border-top:2px solid var(--line)}
.sum .r{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.sum .big{font:400 30px var(--display);color:var(--gold)}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--coal);border-radius:12px;padding:8px 12px;min-height:48px;width:100%;text-align:left}
.tgl .sw{width:44px;height:26px;border-radius:99px;background:var(--coal4);position:relative;flex:none}
.tgl .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ash2);transition:left .15s}
.tgl[aria-pressed="true"] .sw{background:var(--ok)}.tgl[aria-pressed="true"] .sw::after{left:21px;background:#fff}
.confirm{margin-top:12px;padding:12px;border-radius:14px;border:1px solid var(--ember);background:#ff6a1314;display:grid;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--coal2);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi span{display:block;font:700 13px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--ash2)}
.kpi b{font:400 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.item.out{opacity:.55}
.item.out b{text-decoration:line-through;text-decoration-thickness:2px}
.item.out .plus{background:var(--coal4);color:var(--ash3)}
.stk{display:block;font:700 13px var(--cond);letter-spacing:.05em;text-transform:uppercase;color:var(--ash2)}
.stk.low{color:var(--warn)}.stk.zero{color:var(--bad)}
.seg button[disabled]{opacity:.45;text-decoration:line-through}
.sk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sk:first-child{border-top:0}
.sk b.n{font:700 17px/1.15 var(--cond);text-transform:uppercase;letter-spacing:.02em}
.sk .big{font:400 30px/1 var(--display);font-variant-numeric:tabular-nums;min-width:48px;text-align:center}
.sk .big.zero{color:var(--bad)}.sk .big.low{color:var(--warn)}.sk .big.off{color:var(--ash3);font-size:22px}
.sk .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.sk .acts .btn{min-height:40px;padding:8px 12px;font-size:14px}
.cnt-row{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:10px;align-items:center;padding:6px 0}
.cnt-row span{font:700 16px var(--cond);text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ash);color:var(--coal);border-radius:12px;padding:10px 16px;font:700 15px var(--body);max-width:calc(100% - 32px);box-shadow:0 8px 24px #000a}
.toast.err{background:var(--bad);color:#fff}
/* editor do cardápio, planos e assistente inicial */
.d-atend,.d-garcom{background:var(--ok)}
.ed-cat{background:var(--coal2);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:12px}
.ed-cat .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ed-cat .hd b{font:400 22px/1 var(--display);text-transform:uppercase}
.ed-cat .hd .note{flex:1 1 auto}
.ed-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--coal);border-radius:12px;padding:10px 12px;margin-top:6px;min-height:50px}
.ed-row b{display:block;font:700 16px/1.15 var(--cond);text-transform:uppercase;letter-spacing:.02em}
.ed-row small{display:block;color:var(--ash2);font-size:13px}
.ed-row .ip{font:700 16px var(--cond);color:var(--gold);white-space:nowrap}
.ed-row.off b{text-decoration:line-through;color:var(--ash3)}
.mini{min-height:38px!important;padding:6px 12px!important;font-size:14px!important}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.tag{font:700 11px var(--cond);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:1px 7px;color:var(--ash2)}
textarea{width:100%;min-height:90px;background:var(--coal);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ash);font:500 15px/1.4 var(--body);resize:vertical}
input[type=password]{width:100%;background:var(--coal);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ash);font:500 16px var(--body);min-height:46px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px;margin-top:10px}
.plan{background:var(--coal);border:1px solid var(--line);border-radius:14px;padding:12px}
.plan.cur{border-color:var(--ember);background:#ff6a1312}
.plan h4{margin:0;font:400 22px/1 var(--display);text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.plan h4 span{color:var(--gold)}
.plan ul{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--ash2);display:grid;gap:3px}
.plan .now{display:inline-block;margin-top:8px;font:800 12px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--ember)}
.banner.warn{background:#ffb02014;border-color:#ffb02088}
.adm-sec{margin-top:6px}
.lock-ic{font-size:40px;line-height:1;margin-bottom:6px}
.per{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.per button{border:1px solid var(--line);background:var(--coal2);border-radius:99px;padding:6px 12px;min-height:38px;font:700 14px var(--cond);letter-spacing:.05em;text-transform:uppercase}
.per button[aria-pressed="true"]{background:var(--ash);color:var(--coal);border-color:var(--ash)}
.item[disabled]{cursor:not-allowed}
.brand{overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand #brandName{display:inline!important;color:var(--ash)}
</style>
</head><body>
<header class="top"><div class="wrap">
  <div class="brand"><span id="brandName">Comanda</span> <span id="brandSub">Online</span></div>
  <button class="rolebtn" type="button" id="roleBtn" hidden><span class="sync" id="sync"></span><span id="roleName"></span></button>
</div></header>

function splitPath(p){const a=p.split("/");return[a.slice(0,-1).join("/"),a[a.length-1]]}

function readCode(){

  if(l)HASHLIC=l[1];
  if(m||l)try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  return ls("co_loja")||"";
}
async function initStore(){
  CODE=readCode();

    S.fs=firebase.firestore();
    try{await S.fs.enablePersistence({synchronizeTabs:true})}catch(e){}
    await new Promise((res,rej)=>{const un=firebase.auth().onAuthStateChanged(u=>{un();if(u)res();else firebase.auth().signInAnonymously().then(res,rej)})});
    S.mode="fb";
  }catch(e){S.mode="fail";S.why=(e&&e.code)||"erro"}
}
const FP=p=>"lojas/"+CODE+"/"+p;
const ROWS=s=>s.docs.map(d=>Object.assign({},d.data(),{_id:d.id}));
function watch(col,cb,where){
  if(S.mode==="fb"){let q=S.fs.collection(FP(col));if(where)q=q.where(where[0],"==",where[1]);return q.onSnapshot({includeMetadataChanges:true},s=>cb(ROWS(s),s.metadata),e=>dbError(e))}
  const sub={fire(){const m=LOCAL.data[col]||{};cb(Object.keys(m).map(id=>Object.assign({},m[id],{_id:id})).filter(d=>!where||d[where[0]]===where[1]),{fromCache:false})}};
  LOCAL.subs.push(sub);setTimeout(()=>sub.fire(),0);return()=>{LOCAL.subs=LOCAL.subs.filter(x=>x!==sub)};
}
function watchDoc(path,cb){
  if(S.mode==="fb")return S.fs.doc(FP(path)).onSnapshot({includeMetadataChanges:true},d=>cb(d.exists?d.data():null,d.metadata),e=>dbError(e));
  const[c,id]=splitPath(path);const sub={fire(){const m=LOCAL.data[c]||{};cb(m[id]?JSON.parse(JSON.stringify(m[id])):null,{fromCache:false})}};
  LOCAL.subs.push(sub);setTimeout(()=>sub.fire(),0);return()=>{LOCAL.subs=LOCAL.subs.filter(x=>x!==sub)};
}
async function getRange(col,field,from,to){
  if(S.mode==="fb"){const s=await S.fs.collection(FP(col)).where(field,">=",from).where(field,"<=",to).get();return ROWS(s)}
  const m=LOCAL.data[col]||{};return Object.keys(m).map(id=>Object.assign({},m[id],{_id:id})).filter(d=>d[field]>=from&&d[field]<=to);
}
function fire(p){p.catch(writeErr);return Promise.resolve()}
async function put(path,data){if(S.mode==="fb")return fire(S.fs.doc(FP(path)).set(data));const[c,id]=splitPath(path);(LOCAL.data[c]=LOCAL.data[c]||{})[id]=JSON.parse(JSON.stringify(data));localEmit()}
async function patch(path,data){if(S.mode==="fb")return fire(S.fs.doc(FP(path)).update(data));const[c,id]=splitPath(path);const m=LOCAL.data[c]||{};if(!m[id])throw{code:"not-found"};Object.assign(m[id],JSON.parse(JSON.stringify(data)));localEmit()}
async function del(path){if(S.mode==="fb")return fire(S.fs.doc(FP(path)).delete());const[c,id]=splitPath(path);if(LOCAL.data[c])delete LOCAL.data[c][id];localEmit()}
async function contaAppend(m,base,itens){const path="contas/m"+m;
  if(S.mode==="fb"){const FV=firebase.firestore.FieldValue;return fire(S.fs.doc(FP(path)).set(Object.assign({},base,{itens:FV.arrayUnion(...itens)}),{merge:true}))}
  const c=(LOCAL.data.contas=LOCAL.data.contas||{}),d=c["m"+m];

async function contaReplace(m,oldItem,newItem){const path="contas/m"+m;
  if(S.mode==="fb"){const FV=firebase.firestore.FieldValue,ref=S.fs.doc(FP(path)),b=S.fs.batch();b.update(ref,{itens:FV.arrayRemove(oldItem),atualizado:Date.now()});if(newItem)b.update(ref,{itens:FV.arrayUnion(newItem)});return fire(b.commit())}
  const d=(LOCAL.data.contas||{})["m"+m];if(!d)throw{code:"not-found"};const j=d.itens.findIndex(x=>JSON.stringify(x)===JSON.stringify(oldItem));if(j<0)return;
  if(newItem)d.itens.splice(j,1,JSON.parse(JSON.stringify(newItem)));else d.itens.splice(j,1);d.atualizado=Date.now();localEmit()}
async function add(col,data){if(S.mode==="fb")return fire(S.fs.collection(FP(col)).add(data));(LOCAL.data[col]=LOCAL.data[col]||{})[uid()]=JSON.parse(JSON.stringify(data));localEmit()}

/* ================= licença (plano e validade) ================= */
const b64u=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((s.length+3)%4)),c=>c.charCodeAt(0));
let PUBK=null;
async function verifyLic(str){
  try{const parts=String(str||"").trim().split(".");if(parts.length!==2)return null;
    if(!crypto||!crypto.subtle)return null;
    PUBK=PUBK||await crypto.subtle.importKey("jwk",PUBKEY,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
    const pb=b64u(parts[0]);
    if(!await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},PUBK,b64u(parts[1]),pb))return null;
    const o=JSON.parse(new TextDecoder().decode(pb));
    if(!o||o.l!==CODE||!FEATS[o.p]||!/^\d{4}-\d{2}-\d{2}$/.test(o.v))return null;
    o.raw=String(str).trim();return o;
  }catch(e){return null}
}
const dnum=s=>{const[y,m,d]=s.split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
function licDias(){return LIC?dnum(LIC.v)-dnum(today()):-999} // 0 = vence hoje
const TOLER=2; // dias de tolerância depois do vencimento
const bloqueado=()=>!LIC||licDias()< -TOLER;
let LIC; // undefined: carregando; null: sem licença
let LICDOC=undefined,LICKEY=null;
async function applyLicDoc(){
  let o=LICDOC&&LICDOC.lic?await verifyLic(LICDOC.lic):null;
  if(HASHLIC){const h=await verifyLic(HASHLIC);HASHLIC="";
    if(h&&(!o||(h.e||0)>(o.e||0))){o=h;try{await put("config/licenca",{lic:h.raw,atualizado:Date.now()})}catch(e){}toast(dnum(h.v)<dnum(today())?"Esse código já venceu em "+dmy(h.v)+". Peça a renovação.":"Plano "+PLANOS[h.p].n+" ativado até "+dmy(h.v),dnum(h.v)<dnum(today()))}
    else if(!h)toast("Esse código de ativação não é deste estabelecimento.",true)}
  const key=o?o.raw:"";if(LIC!==undefined&&key===LICKEY)return;LICKEY=key;
  const was=LIC&&LIC.p;LIC=o;F=o?FEATS[o.p]:FEATS.basico;
  if(was!==(o&&o.p)){buildMenu();if(F.dono&&KVIA==="plain"){setKey("")}}
  syncPlainKey();if(KEY&&!FECH_UN)startFech();render();
}

addEventListener("hashchange",()=>{const h=location.hash||"";const plain=h.match(/^#([a-z0-9][a-z0-9_-]{7,59})$/i);if(!/loja=|lic=/.test(h)&&!plain)return;

async function ativarCodigo(txt){
  const t=String(txt||"").trim();const m=t.match(/lic=([A-Za-z0-9_.-]{20,})/);const code=m?m[1]:t;
  const lm=t.match(/loja=([A-Za-z0-9_-]{8,60})/);

  await put("config/licenca",{lic:o.raw,atualizado:Date.now()});toast("Plano "+PLANOS[o.p].n+" ativo até "+dmy(o.v));return true;
}

let AC=null;
function audioOn(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
function beep(n){if(!F.som)return;try{if(!AC)return;const t0=AC.currentTime;for(let i=0;i<(n||2);i++){const o=AC.createOscillator(),g=AC.createGain();o.type="square";o.frequency.value=i%2?1320:990;g.gain.setValueAtTime(.0001,t0+i*.22);g.gain.exponentialRampToValueAtTime(.25,t0+i*.22+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+i*.22+.18);o.connect(g).connect(AC.destination);o.start(t0+i*.22);o.stop(t0+i*.22+.2)}}catch(e){}try{navigator.vibrate&&navigator.vibrate([180,80,180])}catch(e){}}
document.addEventListener("pointerdown",()=>{const had=AC&&AC.state==="running";audioOn();if(!had)setTimeout(()=>{if(AC&&AC.state==="running")document.querySelectorAll("[data-som]").forEach(b=>{const x=b.closest(".banner");if(x)x.remove()})},250)},{passive:true});
let WL=null;async function keepAwake(){try{if(navigator.wakeLock&&document.visibilityState==="visible"&&ROLE&&ROLE!=="garcom")WL=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")keepAwake()});
const NOTIF_OK=()=>"Notification" in window&&Notification.permission==="granted";
async function notify(title,body,tag){
  if(!F.som||!NOTIF_OK())return;
  const opt={body,tag,renotify:true,icon:"icons/icon-192.png",badge:"icons/icon-192.png",vibrate:[220,90,220,90,220],data:{url:location.href.split("#")[0]}};
  try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg){await reg.showNotification(title,opt);return}}catch(e){}
  try{new Notification(title,opt)}catch(e){}
}
function notifBanner(){
  if(!F.som||!("Notification" in window)||!ROLE)return"";
  if(Notification.permission==="default")return`<div class="banner" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1 1 200px">Ative os avisos para cada pedido chegar com som e notificação neste celular.</span><button class="btn pri mini" type="button" data-notif>Ativar avisos</button></div>`;
  if(Notification.permission==="denied")return`<p class="banner err">Os avisos estão bloqueados neste celular. Para liberar: toque no cadeado ao lado do endereço (ou em Configurações do app) › Notificações › Permitir.</p>`;
  return"";
}
function soundBanner(){
  if(!F.som||!ROLE)return"";if(AC&&AC.state==="running")return"";
  return`<div class="banner warn" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1 1 200px">O som dos avisos está desligado neste celular. Toque no botão para ligar.</span><button class="btn pri mini" type="button" data-som>Ligar som</button></div>`;
}
function licBanner(){
  if(!LIC)return"";const d=licDias();
  if(d<0)return`<p class="banner err"><b>Plano vencido em ${dmy(LIC.v)}.</b> A comanda para de funcionar ${d<=-TOLER?"hoje":"em "+(TOLER+d+1)+" dia"+(TOLER+d+1>1?"s":"")}. <a href="${waLink("Olá! Quero renovar a Comanda Online de "+(CONFIG.nome||CODE)+".")}" target="_blank" rel="noopener" style="color:inherit;font-weight:700">Renovar pelo WhatsApp</a></p>`;

let loadTimer;
function subscribe(){
  loadTimer=setTimeout(()=>{if(!READY&&!$("slow")){$("app").insertAdjacentHTML("afterbegin",'<p class="banner err" id="slow">A comanda ainda não respondeu. Confira a internet; ela continua tentando sozinha.</p>')}},10000);
  const ok=(k,meta)=>{if(meta&&meta.fromCache)return;LOADED[k]=true;if(LOADED.c&&LOADED.t&&!READY){READY=true;clearTimeout(loadTimer);const s=$("slow");if(s)s.remove();setSync()}};
  watchDoc("config/licenca",(d,meta)=>{if(meta&&meta.fromCache&&!d&&LICDOC===undefined)return;LICDOC=d;applyLicDoc()});
  watchDoc("config/cardapio",(d,meta)=>{if(meta&&meta.fromCache&&!d&&CARD===undefined)return;const j=JSON.stringify(d||null);if(CARD!==undefined&&j===CARDJSON)return;CARDJSON=j;CARD=d||null;buildMenu();if(ADMIN&&EDIT_BUSY)return;render()});
  watchDoc("config/geral",d=>{if(d){if(d.mesas)CONFIG.mesas=Math.max(1,Math.min(80,d.mesas|0));if(d.nome!==undefined)CONFIG.nome=String(d.nome)}$("brandName").textContent=CONFIG.nome||"Comanda";$("brandSub").textContent=CONFIG.nome?"Comanda":"Online";document.title=(CONFIG.nome?CONFIG.nome+" · ":"")+"Comanda Online";refresh()});
  watchDoc("config/estoque",d=>{STOCK=(d&&d.qtd)||{};renderStockMarks();if(!(ROLE==="garcom"||ROLE==="atend")||VIEW==="mesas"||CMESA!==null||(ROLE==="atend"&&ATAB!=="mesas"))refresh()});
  watchDoc("config/dono",(d,meta)=>{const had=!!OWNER,wasOk=OWNER_OK;OWNER=d;if(!meta||!meta.fromCache)OWNER_OK=true;if(OWNER_OK&&CARD!==undefined&&LIC!==undefined&&(had!==!!OWNER||!wasOk))render()});
  watchDoc("config/caixa",d=>{PLAIN=d&&d.k||"";syncPlainKey()});
  watch("contas",(docs,meta)=>{CONTAS={};docs.forEach(d=>{CONTAS[d.mesa]=d});ok("c",meta);refresh()});
  watch("tickets",(docs,meta)=>{TICKETS=docs.sort((a,b)=>a.criado-b.criado);ok("t",meta);alerts();refresh()});
}
// sem plano Completo, o caixa usa a chave aberta (não precisa da senha do dono)
let PLAIN="";
function syncPlainKey(){if(LIC===undefined)return;if(!F.dono&&PLAIN&&needsKey(ROLE)&&KEY!==PLAIN){setKey(PLAIN,"plain");refresh()}}
function alerts(){
  if(SEEN===null){SEEN=new Set(TICKETS.map(t=>t._id));SEEN_READY=new Set(TICKETS.filter(t=>t.status==="pronto").map(t=>t._id));return}
  const rs=roleSetor(ROLE);
  const mine=t=>t.setor===rs||ROLE==="caixa"&&isCaixaSetor(t.setor)||(ROLE==="atend"&&isCaixaSetor(t.setor));
  const novos=TICKETS.filter(t=>!SEEN.has(t._id)&&t.status==="novo"&&mine(t));
  novos.forEach(t=>{NEWIDS.add(t._id);setTimeout(()=>NEWIDS.delete(t._id),5000)});
  TICKETS.forEach(t=>SEEN.add(t._id));
  if(novos.length&&ROLE!=="garcom"){beep(4);
    const pm={};novos.forEach(t=>(pm[t.mesa]=pm[t.mesa]||[]).push(t));
    Object.keys(pm).forEach(m=>notify("Novo pedido · Mesa "+m,pm[m].map(t=>t.itens.map(i=>i.q+"× "+i.n+(i.extra?" ("+i.extra+")":"")+(i.obs?" · "+i.obs:"")).join(", ")).join("\n"),"novo-"+m))}
  if(ROLE==="garcom"||ROLE==="atend"){const prontos=[];TICKETS.filter(t=>t.status==="pronto").forEach(t=>{if(!SEEN_READY.has(t._id)){SEEN_READY.add(t._id);if(t.criado!==t.atualizado)prontos.push(t)}});
    if(prontos.length){beep(2);prontos.forEach(t=>notify("Pronto para levar · Mesa "+t.mesa,(SETOR[t.setor]||"")+": "+t.itens.map(i=>i.q+"× "+i.n).join(", "),"pronto-"+t._id))}}
}

/* ================= desenho das telas ================= */
function render(){
  setSync();
  $("dock").innerHTML="";
  const rb=$("roleBtn");rb.hidden=true;
  if(S.mode==="fail")return renderFail();
  if(!CODE)return renderCode();
  if(LIC===undefined||CARD===undefined)return renderLoading();
  if(!LIC)return renderNoLic();
  if(bloqueado())return renderBlocked();
  if(CARD===null||(!OWNER&&OWNER_OK))return renderSetup();
  if(ROLE&&!roles()[ROLE]){ROLE="";ls("co_role",null)}
  if(ADMIN)return renderAdmin();
  rb.hidden=!ROLE;$("roleName").textContent=roleName();
  if(!ROLE)return renderRoles();
  if(ROLE==="garcom")return VIEW==="mesas"?renderMesas():renderMesa();
  if(F.dono&&isCaixaRole(ROLE)&&!KEY)return renderLocked();
  if(ROLE==="atend")return renderAtend();
  if(ROLE==="caixa")return renderCaixa();
  renderSetor(roleSetor(ROLE));
}
function refresh(){
  if(!S.mode||!ROLE||ADMIN||!LIC||bloqueado()||!CARD)return;
  const typing=()=>{const a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")&&$("app").contains(a)};
  if(F.dono&&isCaixaRole(ROLE)&&!KEY)return;
  if(ROLE==="atend"&&(CMESA!==null||ATAB!=="mesas")){if(typing()){PENDING=true;return}renderAtend();return}
  if(ROLE==="garcom"||ROLE==="atend"){if(VIEW==="mesas")renderMesas();else{renderMesaTop();renderNaMesa()}return}
  if(ROLE==="caixa"){if(typing()){PENDING=true;return}renderCaixa();return}
  renderSetor(roleSetor(ROLE));
}
let PENDING=false;
document.addEventListener("focusout",()=>{if(PENDING){PENDING=false;setTimeout(refresh,50)}});

/* ---------- primeira configuração ---------- */
let SETUP={modelo:"restaurante"};
function renderSetup(){
  if(OWNER&&CARD===null){ // senha já existe, falta só o cardápio
    $("app").innerHTML=`${modeBanner()}<h2 class="sec">Monte o cardápio</h2><p class="note">O cardápio ainda não foi criado. Peça ao dono para abrir os ajustes.</p><button class="btn pri wide" type="button" data-admin>Abrir ajustes do dono</button>`;return}
  const ms=Object.entries(MODELOS);
  $("app").innerHTML=`${modeBanner()}<h2 class="sec">Bem-vindo! <small>${esc(PLANOS[LIC.p].n)}</small></h2>
  <p class="note" style="margin:0 0 6px">Vamos deixar a comanda pronta em 1 minuto. Você pode mudar tudo depois.</p>
  <form id="setupForm" novalidate>
  <div class="fld"><span>Nome do estabelecimento</span><input type="text" id="stNome" maxlength="40" value="${esc(LIC.n||"")}" autocomplete="off"></div>
  <div class="fld"><span>Quantas mesas?</span><input type="text" inputmode="numeric" id="stMesas" value="15" autocomplete="off"></div>
  <div class="fld"><span>Modelo de cardápio para começar</span><div class="seg col" id="stModelo">${ms.map(([k,m])=>`<button type="button" data-v="${k}" aria-pressed="${SETUP.modelo===k}">${esc(m.n)} <small style="float:right;font-weight:600;text-transform:none">${esc(m.d)}</small></button>`).join("")}</div></div>
  <div class="fld"><span>Crie a senha do dono (4 a 8 números)</span><input type="password" inputmode="numeric" id="stPin1" maxlength="8" autocomplete="new-password"></div>
  <div class="fld"><span>Repita a senha</span><input type="password" inputmode="numeric" id="stPin2" maxlength="8" autocomplete="new-password"></div>
  <p class="note">A senha protege o cardápio, os ajustes${F.dono?", o faturamento":""} e a troca de função dos celulares. Guarde bem.</p>
  <p class="note" id="stErr" style="color:var(--bad)" hidden></p>
  <button class="btn pri wide" type="submit" id="stOk" style="margin-top:8px;min-height:56px;font-size:18px">Criar minha comanda</button></form>`;
  $("stModelo").onclick=e=>{const b=e.target.closest("button");if(!b)return;SETUP.modelo=b.dataset.v;$("stModelo").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))};
  $("setupForm").oninput=()=>{$("stErr").hidden=true};
  $("setupForm").onsubmit=async e=>{e.preventDefault();const err=m=>{$("stErr").textContent=m;$("stErr").hidden=false};
    const nome=$("stNome").value.trim(),mesas=num($("stMesas").value),p1=$("stPin1").value.trim(),p2=$("stPin2").value.trim();
    if(!nome)return err("Escreva o nome do estabelecimento.");
    if(!mesas||mesas>80)return err("Número de mesas entre 1 e 80.");
    if(!/^\d{4,8}$/.test(p1))return err("A senha do dono tem de 4 a 8 números.");
    if(p1!==p2)return err("As duas senhas não estão iguais.");
    const b=$("stOk");b.disabled=true;b.textContent="Criando…";
    try{
      const K=Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,"0")).join("");
      const sealed=await sealKey(p1,K);OWNER=sealed;OWNER_OK=true;
      await put("config/dono",sealed);
      if(!F.dono)await put("config/caixa",{k:K});
      await put("config/geral",{mesas,nome});CONFIG.mesas=mesas;CONFIG.nome=nome;
      if(CARD===null){const card=Object.assign({v:1},MODELOS[SETUP.modelo].make());await put("config/cardapio",card)}
      setKey(K,"pin");ADMIN_UNTIL=Date.now()+15*60e3;
      toast("Comanda criada! Confira o cardápio.");ADMIN=true;ADMTAB="cardapio";render();scrollTo(0,0);
    }catch(er){writeErr(er);b.disabled=false;b.textContent="Criar minha comanda"}
  };
}

/* ---------- garçom: mapa de mesas ---------- */
function mesaInfo(m){const c=CONTAS[m];if(!c)return null;const tk=TICKETS.filter(t=>t.mesa===m&&t.conta===c.abertaEm);
  return{c,total:sumItens(c.itens),pronto:tk.filter(t=>t.status==="pronto"&&!isCaixaSetor(t.setor)).length,fila:tk.filter(t=>t.status==="novo"||t.status==="preparo").length}}
function renderMesas(){
  const prontos=TICKETS.filter(t=>t.status==="pronto"&&!(ROLE==="atend"&&isCaixaSetor(t.setor)&&t.criado===t.atualizado));
  const nums=Array.from({length:CONFIG.mesas},(_,i)=>i+1);
  Object.keys(CONTAS).map(Number).forEach(m=>{if(!nums.includes(m))nums.push(m)});
  const abertas=Object.keys(CONTAS).length;
  $("app").innerHTML=`${modeBanner()}${ROLE==="atend"?atendTabs():""}
  ${prontos.length?`<h2 class="sec">Pronto para levar <small>${prontos.length}</small></h2><div class="ready-list">${prontos.map(t=>`<div class="rd"><div><b>Mesa ${t.mesa}</b> <span class="pill" style="background:var(--coal4)">${dot(t.setor)}${esc(SETOR[t.setor]||"")}</span><p>${t.itens.map(i=>esc(i.q+"× "+i.n)).join(", ")}</p></div><button class="btn ok" type="button" data-levei="${t._id}">Levei</button></div>`).join("")}</div>`:""}
  <h2 class="sec">Mesas <small>${abertas?abertas+" aberta"+(abertas>1?"s":""):"todas livres"}</small></h2>
  <div class="mesas">${nums.map(m=>{const i=mesaInfo(m);return`<button class="mesa${i?" occ":""}" type="button" data-mesa="${m}" aria-label="Mesa ${m}${i?", aberta, "+brl(i.total):", livre"}">
    ${i&&i.pronto?'<span class="flag ready">Pronto</span>':i&&i.c.pediuConta?'<span class="flag bill">Conta</span>':""}
    <span class="num">${m}</span><span class="st">${i?brl(i.total):"Livre"}</span>${i?`<span class="t">${ago(i.c.abertaEm)}${i.fila?" · "+i.fila+" na fila":""}</span>`:""}</button>`}).join("")}</div>
  ${!abertas?'<p class="note" style="margin-top:12px">Toque numa mesa para lançar o primeiro pedido.</p>':""}`;
}

function addDraft(it,extra,q){

let SENDING=false;
async function enviar(){
  if(SENDING||!DRAFT.length)return;
  SENDING=true;const b=$("send");if(b){b.disabled=true;b.textContent="Enviando…"}
  const need={};DRAFT.forEach(d=>{if(d.sid&&tracked(d.sid))need[d.sid]=(need[d.sid]||0)+d.q});
  for(const k of Object.keys(need)){if(need[k]>Math.max(0,STOCK[k])){SENDING=false;if(b){b.disabled=false;b.textContent="Enviar pedido da Mesa "+VIEW}const r=Math.max(0,STOCK[k]),n=(ITEM[k]||{}).n||"Item";toast(r?"Só restam "+r+" de "+n+". Diminua a quantidade.":n+" acabou. Tire do pedido.",true);return}}
  const m=VIEW,now=Date.now(),c=CONTAS[m],abertaEm=c?c.abertaEm:now;
  const novos=DRAFT.map(d=>({n:d.n,p:d.p,q:d.q,extra:d.extra,obs:d.obs.trim(),t:now,u:uid()}));
  const porSetor={};DRAFT.forEach(d=>{(porSetor[d.setor]=porSetor[d.setor]||[]).push({q:d.q,n:d.n,extra:d.extra,obs:d.obs.trim()});if(d.aviso)(porSetor[d.aviso]=porSetor[d.aviso]||[]).push({q:d.q,n:d.n,extra:(d.extra?d.extra+" · ":"")+"vai com "+(SETOR[d.setor]||""),obs:d.obs.trim()})});
  try{
    await contaAppend(m,{mesa:m,abertaEm,pediuConta:false,atualizado:now},novos);
    if(Object.keys(need).length){const dec={};Object.keys(need).forEach(k=>dec[k]={inc:-need[k]});await stockWrite({qtd:dec})}
    for(const s of Object.keys(porSetor))await add("tickets",{mesa:m,conta:abertaEm,setor:s,itens:porSetor[s],status:ROLE==="atend"&&isCaixaSetor(s)?"pronto":"novo",criado:now,atualizado:now});
    DRAFT=[];closeSheet();renderDraftBar();toast("Pedido da Mesa "+m+" enviado");
  }catch(e){writeErr(e);if(b){b.disabled=false;b.textContent="Tentar enviar de novo"}}
  SENDING=false;
}

function agg(itens){const m=new Map();(itens||[]).forEach(i=>{const k=i.n+"|"+(i.extra||"")+"|"+i.p;const a=m.get(k);if(a)a.q+=i.q;else m.set(k,{k,n:i.n,extra:i.extra||"",p:i.p,q:i.q})});return[...m.values()]}
function pay(m){return PAY[m]=PAY[m]||{servico:false,pessoas:1,forma:"Pix",recebido:"",confirm:false}}
function totals(m){const c=CONTAS[m],p=pay(m),sub=sumItens(c?c.itens:[]),serv=p.servico?Math.round(sub*10)/100:0,tot=sub+serv;return{sub,serv,tot,cada:tot/Math.max(1,p.pessoas)}}

/* ================= senha do dono =================
   O caixa fica num endereço secreto (a "chave do caixa"), guardada fechada com a senha do dono. */
let OWNER=null,OWNER_OK=false;
let KEY=ls("co_k")||"",KVIA=ls("co_kvia")||"";
let UNLOCK=null,FECH_UN=null,FECH_DAY="";
function startFech(){if(FECH_UN||!KEY||!F.dia)return;FECH_DAY=workday();FECH_UN=watch("cx_"+KEY,docs=>{FECH=docs.sort((a,b)=>b.fechadoEm-a.fechadoEm);refresh()},["dia",FECH_DAY])}
function stopFech(){if(FECH_UN)FECH_UN();FECH_UN=null;FECH=[]}
function setKey(k,via){KEY=k||"";KVIA=KEY?(via||"pin"):"";ls("co_k",KEY||null);ls("co_kvia",KVIA||null);stopFech();if(KEY)startFech()}
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const ub64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function pinKey(pin,salt,iter){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function openKey(pin){if(!OWNER)return null;try{const k=await pinKey(pin,ub64(OWNER.salt),OWNER.iter);return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(OWNER.iv)},k,ub64(OWNER.ct)))}catch(e){return null}}
async function sealKey(pin,K){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=150000;const k=await pinKey(pin,salt,iter);return{salt:b64(salt),iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(K))),iter,atualizado:Date.now()}}
// depois que o dono digita a senha: no Completo some a chave aberta; nos outros planos ela fica para o caixa
async function ownerUnlocked(K){ADMIN_UNTIL=Date.now()+15*60e3;try{if(F.dono){if(PLAIN)await del("config/caixa")}else if(PLAIN!==K)await put("config/caixa",{k:K})}catch(e){}}
let PINRES=null;
function pinSheet(title,msg,mode){
  if(!crypto||!crypto.subtle){toast("Este navegador não abre a área do dono. Use o Chrome atualizado.",true);return Promise.resolve(null)}
  if(!OWNER_OK&&!OWNER&&mode!=="new"){toast("Conectando com a comanda… tente de novo em alguns segundos.",true);return Promise.resolve(null)}
  const create=mode==="new"||!OWNER;
  return new Promise(res=>{
    if(PINRES)PINRES(null);PINRES=res;
    sheet(`<button class="x" type="button" data-close aria-label="Fechar">×</button><h3>${esc(title)}</h3>
    <p class="note" style="margin:0">${create&&mode!=="new"?"Ainda não existe senha do dono. Crie agora uma senha de 4 a 8 números.":esc(msg)}</p>
    <form id="pinForm" novalidate><div class="fld"><span>${create?"Nova senha do dono":"Senha do dono"}</span><input type="password" inputmode="numeric" id="pin1" maxlength="8" autocomplete="off"></div>
    ${create?'<div class="fld"><span>Repita a senha</span><input type="password" inputmode="numeric" id="pin2" maxlength="8" autocomplete="off"></div>':""}
    <p class="note" id="pinErr" style="color:var(--bad);margin:8px 0 0" hidden></p>
    <button class="btn pri wide" type="submit" id="pinOk" style="margin-top:14px">${create?"Criar senha":"Entrar"}</button></form>`);
    setTimeout(()=>{const i=$("pin1");if(i)i.focus()},50);
    const err=m=>{const e=$("pinErr");e.textContent=m;e.hidden=false};
    $("pinForm").oninput=()=>{$("pinErr").hidden=true};
    $("pinForm").onsubmit=async e=>{e.preventDefault();const p1=$("pin1").value.trim();
      if(!/^\d{4,8}$/.test(p1))return err("A senha tem de 4 a 8 números.");
      const b=$("pinOk");b.disabled=true;b.textContent="Conferindo…";
      let K=null;
      if(create){if($("pin2").value.trim()!==p1){b.disabled=false;b.textContent="Criar senha";return err("As duas senhas não estão iguais.")}
        K=mode==="new"&&KEY?KEY:(PLAIN||Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,"0")).join(""));
        const sealed=await sealKey(p1,K);OWNER=sealed;try{await put("config/dono",sealed)}catch(er){writeErr(er);b.disabled=false;b.textContent="Criar senha";return}
        toast(mode==="new"?"Senha do dono trocada":"Senha do dono criada. Guarde bem!")}
      else{K=await openKey(p1);if(!K){b.disabled=false;b.textContent="Entrar";$("pin1").value="";return err("Senha errada.")}}
      await ownerUnlocked(K);
      const r=PINRES;PINRES=null;closeSheet();r&&r(K)};
  });
}

  <div class="fld"><span>Preço</span><input type="text" inputmode="decimal" id="itP" value="${i?String(i.p).replace(".",","):""}" placeholder="Ex.: 25,90" autocomplete="off"></div>
  <div class="fld"><span>Descrição (opcional)</span><input type="text" id="itD" maxlength="80" value="${esc(i&&i.d||"")}" placeholder="Ex.: Arroz, feijão e salada" autocomplete="off"></div>
  <div class="fld"><span>Subgrupo (opcional)</span><input type="text" id="itG" maxlength="30" value="${esc(i&&i.g||"")}" placeholder="Ex.: Latas, 600 ml" autocomplete="off"></div>
  <div class="fld"><span>Opções para escolher (opcional)</span><textarea id="itO" placeholder="Uma por linha. Ex.:&#10;Ponto: Mal passado, Ao ponto, Bem passado&#10;Feijão: Caldo, Tropeiro">${esc(optsText(i&&i.opts))}</textarea><span class="note" style="text-transform:none;letter-spacing:0;font:500 13px var(--body)">O garçom escolhe uma de cada linha ao lançar.</span></div>
  ${outros.length?`<div class="fld"><span>Avisar também outro setor? (opcional)</span><div class="seg" id="itAv"><button type="button" data-av="" aria-pressed="${!st.aviso}">Não</button>${outros.map(s=>`<button type="button" data-av="${esc(s.id)}" aria-pressed="${st.aviso===s.id}">${esc(s.n)}</button>`).join("")}</div><span class="note" style="text-transform:none;letter-spacing:0;font:500 13px var(--body)">Ex.: a jantinha vai para a cozinha e avisa a churrasqueira para assar o espeto escolhido.</span></div>`:""}
  <button class="tgl" type="button" id="itOff" aria-pressed="${!st.off}" style="margin-top:12px"><span>Disponível para pedir</span><span class="sw"></span></button>
  ${F.estoque?`<button class="tgl" type="button" id="itEst" aria-pressed="${st.est}" style="margin-top:8px"><span>Controlar estoque</span><span class="sw"></span></button>`:""}
  <p class="note" id="itErr" style="color:var(--bad)" hidden></p>
  <button class="btn pri wide" type="submit" style="margin-top:14px">Salvar item</button></form>
  ${i?`<button class="btn bad wide" type="button" id="itDel" style="margin-top:8px">Excluir item</button>`:""}`);
  const tg=(id,k,inv)=>{const b=$(id);if(!b)return;b.onclick=()=>{st[k]=!st[k];b.setAttribute("aria-pressed",inv?!st[k]:st[k])}};
  tg("itOff","off",true);tg("itEst","est");
  if($("itAv"))$("itAv").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.aviso=b.dataset.av;$("itAv").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))};
  $("itForm").oninput=()=>{$("itErr").hidden=true};
  $("itForm").onsubmit=async e=>{e.preventDefault();const err=m=>{$("itErr").textContent=m;$("itErr").hidden=false};
    const n=$("itN").value.trim(),p=money($("itP").value),opts=parseOpts($("itO").value);
    if(!n)return err("Escreva o nome do item.");if(p===null)return err("Preço inválido. Ex.: 25,90");if(opts===null)return err("Opções: use “Título: opção 1, opção 2”, uma por linha, com pelo menos 2 opções.");
    const o={id:i?i.id:"i"+sid6(),n,p,d:$("itD").value.trim(),g:$("itG").value.trim(),opts,off:st.off,est:st.est,aviso:st.aviso};
    Object.keys(o).forEach(k=>{if(o[k]===""||o[k]===false||(Array.isArray(o[k])&&!o[k].length))delete o[k]});
    cat.items=cat.items||[];if(i)cat.items[cat.items.indexOf(i)]=o;else cat.items.push(o);
    await saveMenu(c);closeSheet();render();toast(i?"Item salvo":"Item adicionado")};
  if(i)$("itDel").onclick=async()=>{const b=$("itDel");if(!b.dataset.sure){b.dataset.sure=1;b.textContent="Toque de novo para excluir";return}
    cat.items=cat.items.filter(x=>x.id!==i.id);await saveMenu(c);closeSheet();render();toast("Item excluído")};
}
function mesasAdmHTML(){
  const link=location.origin+location.pathname+"#"+CODE;
  return`<div class="box"><b style="font:400 20px var(--display);text-transform:uppercase">Nome do estabelecimento</b><form id="nomeForm" novalidate style="display:flex;gap:8px;margin-top:10px"><input type="text" id="nomeIn" maxlength="40" value="${esc(CONFIG.nome)}" autocomplete="off"><button class="btn" type="submit">Salvar</button></form></div>
  <div class="box"><b style="font:400 20px var(--display);text-transform:uppercase">Número de mesas</b><p class="note" style="margin:4px 0 10px">Quantas mesas aparecem no celular do garçom.</p><div class="step"><button class="qb" type="button" data-mesas="-1" aria-label="Menos mesas">−</button><b id="nMesas">${CONFIG.mesas}</b><button class="qb" type="button" data-mesas="1" aria-label="Mais mesas">+</button></div></div>
  <div class="box"><b style="font:400 20px var(--display);text-transform:uppercase">Conectar outro celular</b><p class="note" style="margin:6px 0 10px">Mande este link para o funcionário. Ao abrir, o celular já entra no estabelecimento; depois ele escolhe a função.${F.setores?"":" No plano Básico são 2 funções: Garçom e Preparo."}</p>
  <p class="note" style="margin:0 0 10px">Código: <b style="color:var(--ash)">${esc(CODE)}</b></p><button class="btn wide" type="button" data-copylink="${esc(link)}">Copiar link de acesso</button>
  <a class="btn ok wide" href="https://wa.me/?text=${encodeURIComponent("Abra este link para entrar na comanda de "+(CONFIG.nome||"nosso estabelecimento")+": "+link)}" target="_blank" rel="noopener" style="display:flex;justify-content:center;align-items:center;margin-top:8px;text-decoration:none">Mandar pelo WhatsApp</a>
  <button class="btn ghost wide" type="button" data-trocaloja style="margin-top:8px">Sair deste estabelecimento</button></div>`;
}

  <p class="note" style="margin:6px 0 0">Válido até <b style="color:var(--ash)">${dmy(LIC.v)}</b> · ${d<0?"vencido":d===0?"vence hoje":"faltam "+d+" dia"+(d>1?"s":"")}</p>
  <div class="plans">${Object.entries(PLANOS).map(([k,p])=>`<div class="plan${k===LIC.p?" cur":""}"><h4>${esc(p.n)} <span>${brl(p.preco).replace(",00","")}/mês</span></h4><ul>${p.itens.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${k===LIC.p?'<span class="now">Seu plano atual</span>':""}</div>`).join("")}</div>
  <a class="btn ok wide" href="${waLink("Olá! Uso a Comanda Online em "+(CONFIG.nome||CODE)+" (plano "+PLANOS[LIC.p].n+"). Quero renovar ou mudar de plano.")}" target="_blank" rel="noopener" style="display:flex;justify-content:center;align-items:center;margin-top:12px;text-decoration:none">Renovar ou mudar de plano</a></div>
  <div class="box"><b style="font:400 20px var(--display);text-transform:uppercase">Recebeu um código novo?</b><p class="note" style="margin:6px 0 0">Depois de pagar a mensalidade você recebe um código de renovação. Cole aqui.</p>${ativarForm()}</div>`;

/* ================= folha (sheet) ================= */
function sheet(html){$("sheetIn").innerHTML=html;$("sheet").hidden=false;EDIT_BUSY=true}
function closeSheet(){$("sheet").hidden=true;$("sheetIn").innerHTML="";OPT=null;EDIT_BUSY=false;if(PINRES){const r=PINRES;PINRES=null;r(null)}}
$("sheet").addEventListener("click",e=>{if(e.target===$("sheet")||e.target.closest("[data-close]"))closeSheet()});
addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)closeSheet()});

/* ================= toques ================= */
document.addEventListener("input",e=>{
  const o=e.target.closest("[data-obs]");if(o){const d=DRAFT[+o.dataset.obs];if(d)d.obs=o.value;return}
  if(e.target.id==="recebido"&&CMESA!==null){const p=pay(CMESA);p.recebido=e.target.value;const T=totals(CMESA),rec=parseFloat(p.recebido.replace(",","."))||0;$("troco").textContent=rec?(rec>=T.tot?"Troco: "+brl(rec-T.tot):"Faltam "+brl(T.tot-rec)):"Digite quanto o cliente entregou para ver o troco."}
});
document.addEventListener("submit",async e=>{
  if(e.target.id==="nomeForm"){e.preventDefault();const n=$("nomeIn").value.trim();if(!n)return;CONFIG.nome=n;$("brandName").textContent=n;try{await put("config/geral",{mesas:CONFIG.mesas,nome:n});toast("Nome salvo")}catch(er){writeErr(er)}}
});
document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.reload!==undefined){location.reload();return}
  if(d.copylink!==undefined){const link=d.copylink||location.origin+location.pathname+"#"+CODE;try{await navigator.clipboard.writeText(link);toast("Link copiado. Mande no WhatsApp do funcionário.")}catch(err){toast(link)}return}
  if(d.trocaloja!==undefined){if(!t.dataset.sure){t.dataset.sure=1;t.textContent="Toque de novo para confirmar";return}ls("co_loja",null);ls("co_role",null);ls("co_k",null);location.hash="";location.reload();return}
  if(d.som!==undefined){audioOn();setTimeout(()=>{beep(2);document.querySelectorAll("[data-som]").forEach(x=>{const b=x.closest(".banner");if(b)b.remove()})},150);return}
  if(d.notif!==undefined){audioOn();try{const r=await Notification.requestPermission();if(r==="granted"){beep(2);notify("Avisos ligados","Os pedidos vão chegar assim neste celular.","teste")}}catch(err){}render();return}
  if(d.admin!==undefined){openAdmin();return}
  if(d.admclose!==undefined){ADMIN=false;render();scrollTo(0,0);return}
  if(d.admtab){ADMTAB=d.admtab;render();scrollTo(0,0);return}
  if(d.edsetor!==undefined){openSetor(d.edsetor);return}
  if(d.edcat!==undefined){openCat(d.edcat);return}
  if(d.edadd){openItem(d.edadd,"");return}
  if(d.editem){const[a,b]=d.editem.split("|");openItem(a,b);return}
  if(d.catmv!==undefined){const c=menuCopy(),i=+d.catmv,j=i+ +d.v;if(j<0||j>=c.cats.length)return;[c.cats[i],c.cats[j]]=[c.cats[j],c.cats[i]];await saveMenu(c);render();return}
  if(d.skcount!==undefined){openContagem();return}
  if(d.skarrive!==undefined){openChegou();return}
  if(d.sk){const k=d.sk,v=+d.v;if(v<0&&(!tracked(k)||STOCK[k]<=0))return;stockWrite({qtd:{[k]:tracked(k)?{inc:v}:Math.max(0,v)}});return}
  if(d.trocasenha!==undefined){trocarSenha();return}
  if(d.unlock!==undefined){const k=await pinSheet("Senha do dono","Digite a senha do dono.","check");if(k){setKey(k,"pin");render()}return}
  if(t.id==="roleBtn"){if(OWNER||!OWNER_OK){const k=await askOwner("Trocar de função","Só o dono troca a função deste celular. Digite a senha do dono.");if(!k)return;UNLOCK=k}
    ROLE="";ls("co_role",null);VIEW="mesas";CMESA=null;ATAB="mesas";CTAB="contas";closeSheet();render();scrollTo(0,0);return}
  if(d.role){
    const r=d.role;
    if(needsKey(r)){
      if(F.dono){const k=UNLOCK||await askOwner("Acesso do dono","Digite a senha do dono para entrar no caixa.");if(!k)return;setKey(k,"pin")}
      else if(PLAIN)setKey(PLAIN,"plain");
    }else setKey("");
    UNLOCK=null;ROLE=r;ls("co_role",ROLE);CTAB=r==="caixa"?"contas":CTAB;audioOn();keepAwake();render();scrollTo(0,0);return}
  if(d.mesa){VIEW=+d.mesa;DRAFT=[];render();scrollTo(0,0);return}
  if(d.go==="mesas"){if(draftCount()&&!t.dataset.sure){t.dataset.sure=1;t.textContent="Sair sem enviar?";setTimeout(()=>{if(t.isConnected){delete t.dataset.sure;t.textContent="‹ Mesas"}},2500);return}VIEW="mesas";DRAFT=[];render();scrollTo(0,0);return}
  if(d.jump){const s=$("cat-"+d.jump);if(s){const y=s.getBoundingClientRect().top+scrollY-120;scrollTo({top:y,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}return}
  if(d.add){const it=ITEM[d.add];if(!it||it.off)return;if(it.opts&&it.opts.length)openOpt(it);else addDraft(it,"",1);return}
  if(d.oq){if(OPT){OPT.q=Math.max(1,OPT.q+ +d.oq);$("oQ").textContent=OPT.q}return}
  if(d.review!==undefined){openReview();return}
  if(d.dq!==undefined){const x=DRAFT[+d.dq];if(x&& +d.v>0&&avail(x.sid)<1){toast(x.n+": não tem mais no estoque",true);return}if(x){x.q+= +d.v;if(x.q<=0)DRAFT.splice(+d.dq,1)}renderDraftBar();openReview();return}
  if(d.pediu!==undefined){const c=CONTAS[VIEW];if(c)try{await patch("contas/m"+VIEW,{pediuConta:!c.pediuConta})}catch(err){writeErr(err)}return}
  if(d.levei){try{await patch("tickets/"+d.levei,{status:"entregue",atualizado:Date.now()})}catch(err){writeErr(err)}return}
  if(d.st){try{await patch("tickets/"+d.st,{status:d.v,atualizado:Date.now()})}catch(err){writeErr(err)}return}
  if(d.tab){if(d.tab==="ajustes"){openAdmin();return}CTAB=d.tab;CMESA=null;renderCaixa();scrollTo(0,0);return}
  if(d.atab){if(d.atab==="ajustes"){openAdmin();return}ATAB=d.atab;VIEW="mesas";CMESA=null;DRAFT=[];render();scrollTo(0,0);return}
  if(d.per){loadPer(d.per);return}
  if(d.conta!==undefined){CMESA=d.conta===""?null:+d.conta;render();scrollTo(0,0);return}
  if(d.rm){await tirarItem(CMESA,d.rm);return}
  if(d.serv!==undefined){const p=pay(CMESA);p.servico=!p.servico;p.confirm=false;render();return}
  if(d.pes){const p=pay(CMESA);p.pessoas=Math.max(1,Math.min(30,p.pessoas+ +d.pes));render();return}
  if(d.forma){const p=pay(CMESA);p.forma=d.forma;p.confirm=false;render();return}
  if(d.fechar){const p=pay(CMESA);if(d.fechar==="pedir"){p.confirm=true;render()}else if(d.fechar==="nao"){p.confirm=false;render()}else fecharConta(CMESA);return}
  if(d.mesas){const n=Math.max(1,Math.min(80,CONFIG.mesas+ +d.mesas));CONFIG.mesas=n;$("nMesas").textContent=n;clearTimeout(MT);MT=setTimeout(async()=>{try{await put("config/geral",{mesas:CONFIG.mesas,nome:CONFIG.nome})}catch(err){writeErr(err)}},700);return}
});
let MT;

setInterval(()=>{if(FECH_UN&&FECH_DAY!==workday()){stopFech();startFech()}},60000);
setInterval(()=>{const g=ROLE==="garcom"||(ROLE==="atend"&&ATAB==="mesas"&&CMESA===null);if(ROLE&&S.mode&&!(g&&VIEW!=="mesas"))refresh();else if(g)renderMesaTop();if(LIC&&bloqueado()&&!ADMIN)render()},30000);

(async()=>{
  await initStore();
  setSync();
  render();
  if(CODE&&(S.mode==="local"||S.mode==="fb"))subscribe();
  if(KEY)startFech();
  keepAwake();
})();
</script><script>if("serviceWorker" in navigator&&location.protocol==="https:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
